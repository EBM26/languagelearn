name = "languagelearn"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "language-app-db"
database_id = "81c0d4ee-6028-4222-91b7-001ea654a289"   # replace with the real id from `wrangler d1 list`

# LLM adapter config. The API key is a secret, set in the Pages dashboard (never committed): LLM_API_KEY.
[vars]
LLM_PROVIDER = "gemini"                      # gemini | anthropic | openai | mock
LLM_MODEL = "gemini-3.8-flash"               # tried first
LLM_FALLBACK_MODEL = "gemini-3.5-flash-lite" # used if the primary hits 429 / 5xx / network error / empty reply
