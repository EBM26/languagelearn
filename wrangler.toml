name = "languagelearn"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "language-app-db"
database_id = "81c0d4ee-6028-4222-91b7-001ea654a289"   # replace with the real id from `wrangler d1 list`

# LLM adapter config. The API key is a secret: `wrangler pages secret put LLM_API_KEY`.
[vars]
LLM_PROVIDER = "anthropic"          # anthropic | openai (OpenAI-compatible) | mock
LLM_MODEL = "claude-sonnet-5-5"
